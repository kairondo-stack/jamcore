[package]
name = "jamandroid"
version = "0.1.0"
edition = "2021"

[lib]
name = "jamandroid"
crate-type = ["cdylib"]

[dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
eframe = { version = "0.36", default-features = false, features = [
    "android-native-activity",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
jamcore = { path = "../core" }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
