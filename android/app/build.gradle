plugins {
    id 'com.android.application'
}

android {
    namespace 'org.jamcore.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.jamcore.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
