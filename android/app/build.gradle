plugins {
    id 'com.android.application'
}

android {
    namespace 'org.jamcore.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.jamcore.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
        ndk {
            // Handy (arm64-v8a) + Emulator (x86_64); ueber die Umgebungsvariable
            // ABIS einschraenkbar, siehe android/build-apk.sh.
            abiFilters((System.getenv('ABIS') ?: 'arm64-v8a x86_64').split())
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // Release-Signatur: Keystore liegt in android/release.keystore (nicht im
    // Git; bitte sichern!). Passwort ist ein Projekt-Passwort.
    signingConfigs {
        release {
            storeFile file('../release.keystore')
            storePassword 'jamcore-release'
            keyAlias 'jamcore'
            keyPassword 'jamcore-release'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
