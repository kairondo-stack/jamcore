[package]
name = "rrn5"
version = "0.1.0"
edition = "2021"

[dependencies]
opencv = { version = "0.101", default-features = false, features = ["videoio"] }
sdl2 = { version = "0.37", features = ["unsafe_textures"] }
image = "0.25"
rosc = "0.9"
shared_memory = "0.12"
x11 = { version = "2", features = ["xlib"] }